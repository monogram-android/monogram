[package]
name = "monogram-mtproto"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
description = "UniFFI MTProto bridge for Monogram"
publish = false

[lib]
name = "monogram_mtproto"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bindgen-cli = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32", default-features = false }
parking_lot = "0.12"
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "encoders", "decoders", "encoding_rs"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tlottie = { path = "../../vendor/tlottie", default-features = false, features = ["cpu", "std"] }
mono-proto-client = { path = "../../vendor/mono-rs/crates/mono-proto-client", version = "0.1.0" }
mono-proto = { path = "../../vendor/mono-rs/crates/mono-proto", version = "0.2.0" }
mono-proto-media = { path = "../../vendor/mono-rs/crates/mono-proto-media", version = "0.1.0" }
mono-proto-messages = { path = "../../vendor/mono-rs/crates/mono-proto-messages", version = "0.1.0" }
mono-proto-observability = { path = "../../vendor/mono-rs/crates/mono-proto-observability", version = "0.1.0" }
mono-proto-runtime = { path = "../../vendor/mono-rs/crates/mono-proto-runtime", version = "0.1.0" }
mono-proto-socket = { path = "../../vendor/mono-rs/crates/mono-proto-socket", version = "0.1.0" }
mono-proto-types = { path = "../../vendor/mono-rs/crates/mono-proto-types", version = "0.1.0" }

[dev-dependencies]
mono-proto-client = { path = "../../vendor/mono-rs/crates/mono-proto-client", version = "0.1.0", features = ["test-support"] }

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen-cli"]
